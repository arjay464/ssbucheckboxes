<!DOCTYPE html>
<html>
<head>
    <title>SSBU Purity Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="UDfKbGoXH2h61VZL6j15EVBaaspOvkNeq98kAHIxQAk" />
    <meta name="description" content="The Official SSBU Rice Purity Test. How pure of a smash player are you?">
   <style>
    body {
        font-family: 'Times New Roman', serif;
        max-width: 800px;
        margin: 20px 0;
        padding: 0 20px;
        background-color: #fdeec7;
        background-image: url('background.png');
        background-repeat: repeat;
        text-align: left;
    }

    .header-container {
        max-width: 800px;
        margin: 0 auto 20px auto; 
        text-align: center;
        padding: 0 20px;
    }
    
    h2 {
        color: #bb1414;
        font-size: 64px;
        margin-bottom: 5px;
        text-align: center;
    }
    
    .subtitle {
        color: #000000;
        font-size: 32px;
        margin-bottom: 20px;
        text-align: center;
    }
    
    #checkboxes {
        text-align: left;
        padding: 0 20px;
        max-width: none;
    }
    
    .checkbox-item {
        margin: 5px 0;
        text-align: left;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        justify-content: flex-start;
    }
    
    .checkbox-item .number {
        min-width: 30px;
        flex-shrink: 0;
        font-size: 24px;
        text-align: right;
    }
    
    .checkbox-item input[type="checkbox"] {
    flex-shrink: 0;
    margin-top: 3px;
    width: 20px;
    height: 20px;
    cursor: pointer;
    }
    
    .checkbox-item label {
        flex: 1;
        font-family: 'Times New Roman', serif;
        font-size: 24px;
    }
    
   button {
        padding: 10px 20px;
        font-size: 16px;
        margin: 20px 0 0 20px;  /* Left aligned with checkboxes */
    }
    
    #result {
        margin-top: 10px;
        font-weight: bold;
    }
    
    /* Results page styles */
    .results-page {
        display: none;
        text-align: center;
        padding: 50px 20px;
    }
    
    .results-page.active {
        display: block;
    }
    
    .score-label {
        font-size: 24px;
        color: #000000;
        margin-bottom: 20px;
    }
    
    .score-number {
        font-size: 120px;
        font-weight: bold;
        color: #bb1414;
        margin: 20px 0;
    }
    
    .made-by {
        font-size: 18px;
        color: #000000;
        margin-top: 50px;
    }
    
    .back-button {
        margin-top: 30px;
    }
    
    .main-page.hidden {
        display: none;
    }
    
    /* Mobile styles */
    @media (max-width: 600px) {
        body {
            font-size: 16px;
        }
        h2 {
            font-size: 24px;
        }
        .subtitle {
            font-size: 18px;
        }
        .score-number {
            font-size: 80px;
        }
        .checkbox-item label {
            font-size: 18px;
        }
         .checkbox-item .number {
            min-width: 30px;
            flex-shrink: 0;
            font-size: 18px;
            text-align: right;
        }
        .checkbox-item input[type="checkbox"] {
            flex-shrink: 0;
            margin-top: 3px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
    }
</style>
</head>
<body>
    <div class="main-page" id="mainPage">
    <div class="header-container">
        <h2>SSBU Purity Test</h2>
        <h2> </h2>
        <div class="subtitle">THIS IS NOT A TO DO LIST. COMPLETION MAY RESULT IN YEARS OF THERAPY.</div>
        <div class="subtitle">Made by Arjay; Inspired by the Valorant Rice Purity Test</div>
    </div>
    
    <div id="checkboxes">
        <!-- Checkboxes will be generated here -->
    </div>
    
    <button onclick="showResults()">Calculate My Score</button>
    <div id="result"></div>
    </div>
    
    <div class="results-page" id="resultsPage">
        <div class="score-label">Your SSBU Purity Score is:</div>
        <div class="score-number" id="scoreDisplay">0</div>
        <div class="made-by">Congrats.</div>
        <button class="back-button" onclick="goBack()">Take the Test Again</button>
    </div>

    <script>
        // Load labels from file and generate checkboxes
        fetch('labels.txt')
            .then(response => response.text())
            .then(text => {
                const labels = text.split('\n').filter(line => line.trim() !== '');
                const container = document.getElementById('checkboxes');
                
                labels.forEach((label, index) => {
                    const div = document.createElement('div');
                    div.className = 'checkbox-item';
                    div.innerHTML = `
                        <span class="number">${index + 1}.</span>
                        <input type="checkbox" id="cb${index + 1}">
                        <label for="cb${index + 1}">${label.trim()}</label>
                    `;
                    container.appendChild(div);
                });
    })
    .catch(error => {
        console.error('Error loading labels:', error);
        document.getElementById('checkboxes').innerHTML = '<p>Error loading labels. Make sure labels.txt is in the same folder.</p>';
    });

        // Show results page
        function showResults() {
            const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
            
            // Update score display
            document.getElementById('scoreDisplay').textContent = 100 - checked;
            
            // Hide main page, show results
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('resultsPage').classList.add('active');
            
            // Scroll to top
            window.scrollTo(0, 0);
        }
        
        // Go back to main page
        function goBack() {
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = false;
            });
            
            document.getElementById('resultsPage').classList.remove('active');
            document.getElementById('mainPage').classList.remove('hidden');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
