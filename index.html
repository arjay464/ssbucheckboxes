<!DOCTYPE html>
<html>
<head>
    <title>SSBU Purity Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Times New Roman', serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            background-color: #fdeec7;
            text-align: left;
        }
    @media (max-width: 600px) {
        body {
        font-size: 16px;
        }
        h2 {
        font-size: 24px;
        }
        .score-number {
        font-size: 80px;
        }
    }
        h2 {
            color: #bb1414;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #000000;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .checkbox-item {
            margin: 5px 0;
            text-align: left;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .checkbox-item .number {
            min-width: 30px;
            flex-shrink: 0;
        }
        .checkbox-item input[type="checkbox"] {
            flex-shrink: 0;
            margin-top: 3px;
        }
        .checkbox-item label {
            flex: 1;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 20px;
        }
        #result {
            margin-top: 10px;
            font-weight: bold;
        }
        
        /* Results page styles */
        .results-page {
            display: none;
            text-align: center;
            padding: 50px 20px;
        }
        .results-page.active {
            display: block;
        }
        .score-label {
            font-size: 24px;
            color: #000000;
            margin-bottom: 20px;
        }
        .score-number {
            font-size: 120px;
            font-weight: bold;
            color: #bb1414;
            margin: 20px 0;
        }
        .made-by {
            font-size: 18px;
            color: #000000;
            margin-top: 50px;
        }
        .back-button {
            margin-top: 30px;
        }
        
        .main-page.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="main-page" id="mainPage">
        <h2>SSBU Purity Test</h2>
        <div class="subtitle">THIS IS NOT A TO DO LIST. COMPLETION MAY RESULT IN YEARS OF THERAPY.</div>
        <div class="subtitle">Inspired by the Valorant Purity Test</div>
        
        <div id="checkboxes">
            <!-- Checkboxes will be generated here -->
        </div>
        
        <button onclick="showResults()">Calculate My Score</button>
        <div id="result"></div>
    </div>
    
    <div class="results-page" id="resultsPage">
        <div class="score-label">Your SSBU Purity Score is:</div>
        <div class="score-number" id="scoreDisplay">0</div>
        <div class="made-by">Congrats. Whatever your score.</div>
        <button class="back-button" onclick="goBack()">Take the test again.</button>
    </div>

    <script>
        // Load labels from file and generate checkboxes
        fetch('labels.txt')
            .then(response => response.text())
            .then(text => {
                const labels = text.split('\n').filter(line => line.trim() !== '');
                const container = document.getElementById('checkboxes');
                
                labels.forEach((label, index) => {
                    const div = document.createElement('div');
                    div.className = 'checkbox-item';
                    div.innerHTML = `
                        <span class="number">${index + 1}.</span>
                        <input type="checkbox" id="cb${index + 1}">
                        <label for="cb${index + 1}">${label.trim()}</label>
                    `;
                    container.appendChild(div);
                });
    })
    .catch(error => {
        console.error('Error loading labels:', error);
        document.getElementById('checkboxes').innerHTML = '<p>Error loading labels. Make sure labels.txt is in the same folder.</p>';
    });

        // Show results page
        function showResults() {
            const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
            
            // Update score display
            document.getElementById('scoreDisplay').textContent = 100 - checked;
            
            // Hide main page, show results
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('resultsPage').classList.add('active');
            
            // Scroll to top
            window.scrollTo(0, 0);
        }
        
        // Go back to main page
        function goBack() {
            document.getElementById('resultsPage').classList.remove('active');
            document.getElementById('mainPage').classList.remove('hidden');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
