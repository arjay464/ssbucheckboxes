<!DOCTYPE html>
<html>
<head>
    <title>Checkbox Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 20px auto;
        }
        .checkbox-container {
            max-height: 400px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 20px;
        }
        .checkbox-item {
            margin: 5px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
        }
        #result {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Checkbox Counter</h2>
    
    <div class="checkbox-container" id="checkboxes">
        <!-- Checkboxes will be generated here -->
    </div>
    
    <button onclick="countChecked()">Count Checked</button>
    <div id="result"></div>

    <script>
        // Generate 100 checkboxes
        const container = document.getElementById('checkboxes');
        for (let i = 1; i <= 100; i++) {
            const div = document.createElement('div');
            div.className = 'checkbox-item';
            div.innerHTML = `<input type="checkbox" id="cb${i}"> <label for="cb${i}">Item ${i}</label>`;
            container.appendChild(div);
        }

        // Count checked boxes
        function countChecked() {
            const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
            document.getElementById('result').textContent = `Checked: ${checked} / 100`;
        }
    </script>
</body>
</html>
